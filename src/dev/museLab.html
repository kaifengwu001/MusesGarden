<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Muse lab</title>
    <style>
      html,
      body {
        margin: 0;
        background: #fff;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="lab"></canvas>
    <script type="module">
      // lineup=1: the muses in clothes in a row (museLineup.ts); else one Muse (museLab.ts)
      if (new URLSearchParams(location.hash.slice(1)).get('lineup') === '1') import('./museLineup.ts');
      else import('./museLab.ts');
    </script>
  </body>
</html>
